spring.application.name=CRUD
server.port=${PORT:8080}
server.forward-headers-strategy=native

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.max-lifetime=300000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.data.redis.url=${REDIS_URL}

file-vault.directory=/tmp/vault-storage
spring.servlet.multipart.max-file-size=35MB
spring.servlet.multipart.max-request-size=35MB

pdf.company-name=Taha Waheed's Company
pdf.footer=Thank you for your order
pdf.password=${PDF_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

app.bootstrap.manager.name=Admin Manager
app.bootstrap.manager.email=${BOOTSTRAP_MANAGER_EMAIL:manager@company.com}
app.bootstrap.manager.password=${BOOTSTRAP_MANAGER_PASSWORD}

app.login.max-attempts=5
app.login.block-minutes=1
app.rate-limit.per-minute=60
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=MANAGER

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{20} - %msg%n

app.orders.expire-after=7d
app.orders.expire-dry-run=true
app.refunds.window-days=14